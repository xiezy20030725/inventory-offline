name: inventory_offline
description: 本地离线库存管理系统（手机端）— 纯本地运行，无网络依赖。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 本地数据库：SQLite，支持事务与联合唯一索引
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  # 状态管理：轻量 ChangeNotifier
  provider: ^6.1.2
  # 本地键值配置（预警设置/应用锁/仓库切换记忆）
  shared_preferences: ^2.3.2
  # 扫码：基于 CameraX 的一维码/二维码识别
  mobile_scanner: ^5.2.3
  # 拍照/相册：商品图片与单据凭证
  image_picker: ^1.1.2
  # 本地通知：离线预警推送
  flutter_local_notifications: ^17.2.3
  # 数字/日期格式化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
